service: sembramos-identity-profile-service
frameworkVersion: ~4.34.0

package:
  individually: true
  patterns:
    # --- Inclusiones explicitas (lo unico que necesita la Lambda en runtime) ---
    - dist/**
    - node_modules/**
    - package.json
    - package-lock.json
    - prisma/**

    # --- Codigo fuente y artefactos de compilacion innecesarios ---
    - '!src/**'
    - '!**/*.ts'
    - '!**/*.map'
    - '!**/tsconfig*.json'

    # --- Archivos ocultos, cachés y basura del entorno ---
    - '!.git/**'
    - '!.github/**'
    - '!.vscode/**'
    - '!.env'
    - '!.env.*'
    - '!**/.gitignore'
    - '!node_modules/.cache/**'
    - '!node_modules/.bin/**'

    # --- Documentacion y tests dentro de dependencias ---
    - '!node_modules/**/*.md'
    - '!node_modules/**/test/**'
    - '!node_modules/**/tests/**'
    - '!node_modules/**/*.test.js'

    # --- Dependencias de desarrollo (no deben viajar a Lambda) ---
    - '!node_modules/typescript/**'
    - '!node_modules/ts-node-dev/**'
    - '!node_modules/ts-jest/**'
    - '!node_modules/jest/**'
    - '!node_modules/jest-*/**'
    - '!node_modules/@jest/**'
    - '!node_modules/@types/**'
    - '!node_modules/supertest/**'
    - '!node_modules/serverless/**'
    - '!node_modules/serverless-offline/**'
    - '!node_modules/prisma/**'

    # NOTA: @aws-sdk/@smithy SI se empaquetan. El runtime de Lambda no provee de
    # forma fiable todos los subpaquetes que usamos (p. ej. s3-request-presigner),
    # y el codigo los importa en el arranque (S3/SQS), asi que excluirlos rompia
    # el init de la Lambda. Hay margen de tamano de sobra para incluirlos.

    # pdf-parse v2 ya trae pdfjs incrustado en su bundle CJS (dist/.../index.cjs),
    # asi que el paquete pdfjs-dist no se requiere en runtime. (@napi-rs/canvas SI
    # se necesita: aporta el polyfill de DOMMatrix que usa getText()).
    - '!node_modules/pdfjs-dist/**'

    # --- Prisma 7: adelgazamiento del runtime ---
    # El runtime de @prisma/client embebe compiladores WASM para TODAS las BD
    # (postgres, sqlserver, cockroach, sqlite, mysql) en variantes fast/small y
    # js/mjs (~70 MB). Solo usamos MySQL/MariaDB; fuera el resto.
    - '!node_modules/@prisma/client/runtime/query_compiler_*_bg.postgresql.*'
    - '!node_modules/@prisma/client/runtime/query_compiler_*_bg.sqlserver.*'
    - '!node_modules/@prisma/client/runtime/query_compiler_*_bg.cockroachdb.*'
    - '!node_modules/@prisma/client/runtime/query_compiler_*_bg.sqlite.*'
    # Paquetes que el CLI 'prisma' arrastra (Prisma Studio con React, dev tools,
    # effect/electric-sql via @prisma/config) y que NO se usan en runtime. npm los
    # deja como "prod" por el peer opcional de @prisma/client, pero el runtime real
    # solo necesita @prisma/client(+runtime-utils) y @prisma/adapter-mariadb.
    - '!node_modules/@prisma/studio-core/**'
    - '!node_modules/@prisma/dev/**'
    - '!node_modules/effect/**'
    - '!node_modules/@electric-sql/**'
    - '!node_modules/react/**'
    - '!node_modules/react-dom/**'
    - '!node_modules/chart.js/**'
    - '!node_modules/@radix-ui/**'

    # --- Purga critica de Prisma: fuera TODOS los engines binarios ---
    - '!node_modules/@prisma/engines/**'
    - '!node_modules/.prisma/client/libquery_engine-*'
    # Reincluir UNICAMENTE el query engine de AWS Lambda (debe ir al final
    # para que prevalezca sobre la exclusion anterior).
    - node_modules/.prisma/client/libquery_engine-rhel-openssl-3.0.x.so.node

provider:
  name: aws
  runtime: nodejs20.x
  region: us-east-2
  timeout: 30
  # La Lambda vive en la VPC default para alcanzar MariaDB (RDS) por routing
  # interno (SG-to-SG). Declararlo aqui evita que cada deploy borre la config de
  # VPC (antes se ponia a mano en la consola y se perdia). Para salir a servicios
  # publicos (SQS, S3) la VPC usa VPC Endpoints (SQS Interface + S3 Gateway).
  vpc:
    securityGroupIds:
      - sg-02d69ae1041692ea7
    subnetIds:
      - subnet-0dfe7d838289693b2
      - subnet-07276540ff15853dc
      - subnet-0e9d2c48c49f94233
  environment:
    DATABASE_URL: ${env:DATABASE_URL}
    # URL de la cola SQS creada en el bloque resources (Ref devuelve la URL).
    VERIFICATION_QUEUE_URL:
      Ref: VerificationQueue
    # Bucket S3 donde se guardan los documentos KYC subidos por los usuarios.
    KYC_BUCKET:
      Ref: KycBucket
  iam:
    role:
      statements:
        # Permite a la Lambda escribir mensajes en la cola de verificacion.
        - Effect: Allow
          Action:
            - sqs:SendMessage
          Resource:
            Fn::GetAtt: [VerificationQueue, Arn]
        # Permite subir el documento KYC y generar URLs prefirmadas de descarga.
        - Effect: Allow
          Action:
            - s3:PutObject
            - s3:GetObject
          Resource:
            Fn::Sub: '${KycBucket.Arn}/*'

functions:
  api:
    handler: dist/lambda.handler
    events:
      - httpApi: '*'

resources:
  Resources:
    # Cola SQS que recibe las solicitudes de verificacion para el servicio de IA.
    VerificationQueue:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: ${self:service}-verification-queue
        # Tiempo que un mensaje queda oculto mientras un consumidor lo procesa.
        VisibilityTimeout: 60
        # Retiene los mensajes hasta 4 dias si nadie los consume aun.
        MessageRetentionPeriod: 345600

    # Bucket PRIVADO para los documentos KYC. El acceso es solo via URLs
    # prefirmadas; bloqueamos todo acceso publico.
    KycBucket:
      Type: AWS::S3::Bucket
      Properties:
        BucketName: ${self:service}-kyc-documents
        PublicAccessBlockConfiguration:
          BlockPublicAcls: true
          BlockPublicPolicy: true
          IgnorePublicAcls: true
          RestrictPublicBuckets: true