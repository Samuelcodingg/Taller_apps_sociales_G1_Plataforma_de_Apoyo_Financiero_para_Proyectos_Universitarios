name: B2B Project Service CI/CD

on:
  push:
    branches:
      - feature/develop
      - master
    paths:
      - 'b2b-project-service/**'
      - '.github/workflows/b2b-project-service.yml'
  pull_request:
    branches:
      - master
    paths:
      - 'b2b-project-service/**'
      - '.github/workflows/b2b-project-service.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-2

jobs:
  ci:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: b2b-project-service/package-lock.json

      - name: Install dependencies
        working-directory: ./b2b-project-service
        run: npm ci

      - name: Generate Prisma client
        working-directory: ./b2b-project-service
        run: npm run prisma:generate --if-present

      - name: Run tests
        working-directory: ./b2b-project-service
        run: npm test

      - name: Build
        working-directory: ./b2b-project-service
        run: npm run build

  resolve-deploy-env:
    name: Resolve Deploy Environment
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.resolve.outputs.should_deploy }}
      target_env: ${{ steps.resolve.outputs.target_env }}
      stage: ${{ steps.resolve.outputs.stage }}
    steps:
      - name: Resolve deploy target
        id: resolve
        shell: bash
        run: |
          SHOULD_DEPLOY="false"
          TARGET_ENV=""
          STAGE=""

          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/feature/develop" ]; then
            SHOULD_DEPLOY="true"
            TARGET_ENV="qa"
            STAGE="qa"
          elif [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/master" ]; then
            SHOULD_DEPLOY="true"
            TARGET_ENV="prd"
            STAGE="prod"
          fi

          echo "should_deploy=${SHOULD_DEPLOY}" >> "$GITHUB_OUTPUT"
          echo "target_env=${TARGET_ENV}" >> "$GITHUB_OUTPUT"
          echo "stage=${STAGE}" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy Lambda
    runs-on: ubuntu-latest
    needs: [ci, resolve-deploy-env]
    if: needs.resolve-deploy-env.outputs.should_deploy == 'true'
    environment: ${{ needs.resolve-deploy-env.outputs.target_env }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: b2b-project-service/package-lock.json

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: us-east-2

      - name: Install dependencies
        working-directory: ./b2b-project-service
        run: npm ci

      - name: Generate Prisma client
        working-directory: ./b2b-project-service
        run: npm run prisma:generate --if-present

      - name: Build
        working-directory: ./b2b-project-service
        run: npm run build

      - name: Prune dev dependencies
        working-directory: ./b2b-project-service
        run: npm prune --omit=dev

      - name: Keep only Lambda Prisma engine
        working-directory: ./b2b-project-service
        shell: bash
        run: |
          if [ -d node_modules/.prisma/client ]; then
            find node_modules/.prisma/client -type f -name 'libquery_engine-*' ! -name 'libquery_engine-rhel-openssl-3.0.x.so.node' -delete
          fi
          rm -rf node_modules/@prisma/engines || true

      - name: Deploy with Serverless
        working-directory: ./b2b-project-service
        env:
          SERVERLESS_ACCESS_KEY: ${{ secrets.SERVERLESS_ACCESS_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npx serverless deploy --config serverless.deploy.yml --stage ${{ needs.resolve-deploy-env.outputs.stage }}
