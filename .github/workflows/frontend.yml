name: Frontend CI/CD

on:
  push:
    branches:
      - feature/develop
      - master
    paths:
      - 'client/**'
      - '.github/workflows/frontend.yml'
  pull_request:
    branches:
      - master
    paths:
      - 'client/**'
      - '.github/workflows/frontend.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-2

jobs:
  ci:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        working-directory: ./client
        run: npm ci

      - name: Test
        working-directory: ./client
        run: npm test --if-present

      - name: Build
        working-directory: ./client
        run: npm run build --if-present

  resolve-deploy-env:
    name: Resolve Deploy Environment
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.resolve.outputs.should_deploy }}
      target_env: ${{ steps.resolve.outputs.target_env }}
      stage: ${{ steps.resolve.outputs.stage }}
    steps:
      - name: Resolve deploy target
        id: resolve
        shell: bash
        run: |
          SHOULD_DEPLOY="false"
          TARGET_ENV=""
          STAGE=""

          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/feature/develop" ]; then
            SHOULD_DEPLOY="true"
            TARGET_ENV="qa"
            STAGE="qa"
          elif [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/master" ]; then
            SHOULD_DEPLOY="true"
            TARGET_ENV="prd"
            STAGE="prod"
          fi

          echo "should_deploy=${SHOULD_DEPLOY}" >> "$GITHUB_OUTPUT"
          echo "target_env=${TARGET_ENV}" >> "$GITHUB_OUTPUT"
          echo "stage=${STAGE}" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy to S3 + CloudFront
    runs-on: ubuntu-latest
    needs: [ci, resolve-deploy-env]
    if: needs.resolve-deploy-env.outputs.should_deploy == 'true'
    environment: ${{ needs.resolve-deploy-env.outputs.target_env }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Configure AWS credentials (QA)
        if: needs.resolve-deploy-env.outputs.target_env == 'qa'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME_QAS }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Configure AWS credentials (PRD)
        if: needs.resolve-deploy-env.outputs.target_env == 'prd'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME_PRD }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Install dependencies
        working-directory: ./client
        run: npm ci

      # Las variables VITE_* se incrustan en build-time. Defínelas como
      # "Variables" del repo/entorno en GitHub apuntando a las URLs reales de
      # cada microservicio (API Gateway). Si faltan, el build usa los defaults
      # de src/lib/constants.ts.
      - name: Build
        working-directory: ./client
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_CAMPAIGN_API_URL: ${{ vars.VITE_CAMPAIGN_API_URL }}
          VITE_FUNDING_API_URL: ${{ vars.VITE_FUNDING_API_URL }}
        run: npm run build

      # Provisiona/actualiza el bucket S3 + CloudFront (idempotente). La primera
      # ejecucion crea la distribucion (puede tardar varios minutos).
      - name: Provision infra (S3 + CloudFront)
        shell: bash
        run: |
          aws cloudformation deploy \
            --template-file client/infra/cloudfront-s3.yml \
            --stack-name "sembramos-client-${{ needs.resolve-deploy-env.outputs.stage }}" \
            --parameter-overrides Stage=${{ needs.resolve-deploy-env.outputs.stage }} \
            --capabilities CAPABILITY_IAM \
            --region "$AWS_REGION"

      - name: Read stack outputs
        id: stack
        shell: bash
        run: |
          STACK="sembramos-client-${{ needs.resolve-deploy-env.outputs.stage }}"
          BUCKET=$(aws cloudformation describe-stacks --stack-name "$STACK" --region "$AWS_REGION" \
            --query "Stacks[0].Outputs[?OutputKey=='BucketName'].OutputValue" --output text)
          DIST_ID=$(aws cloudformation describe-stacks --stack-name "$STACK" --region "$AWS_REGION" \
            --query "Stacks[0].Outputs[?OutputKey=='DistributionId'].OutputValue" --output text)
          DOMAIN=$(aws cloudformation describe-stacks --stack-name "$STACK" --region "$AWS_REGION" \
            --query "Stacks[0].Outputs[?OutputKey=='DistributionDomainName'].OutputValue" --output text)
          echo "bucket=${BUCKET}" >> "$GITHUB_OUTPUT"
          echo "dist_id=${DIST_ID}" >> "$GITHUB_OUTPUT"
          echo "Frontend URL: https://${DOMAIN}"

      # Sube los estaticos. Los assets con hash se cachean fuerte; index.html no
      # se cachea para que cada deploy se vea de inmediato.
      - name: Sync to S3
        shell: bash
        run: |
          BUCKET="${{ steps.stack.outputs.bucket }}"
          aws s3 sync client/dist "s3://${BUCKET}" --delete \
            --exclude index.html \
            --cache-control "public,max-age=31536000,immutable"
          aws s3 cp client/dist/index.html "s3://${BUCKET}/index.html" \
            --cache-control "no-cache,no-store,must-revalidate"

      - name: Invalidate CloudFront cache
        shell: bash
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ steps.stack.outputs.dist_id }}" \
            --paths "/*"
