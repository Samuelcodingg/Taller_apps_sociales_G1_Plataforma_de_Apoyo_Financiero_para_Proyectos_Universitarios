name: Frontend CI/CD

# Frontend de microfrontends (Module Federation). Cada MFE se construye y se
# despliega de forma INDEPENDIENTE: un push que solo toca
# client/packages/mf-auth/** despliega unicamente ese microfrontend a su bucket.
# El shell no necesita reconstruirse cuando cambia un MFE, porque las URLs de
# los remotes son rutas fijas del propio dominio (/mf/<nombre>/...).

on:
  push:
    branches:
      - feature/develop
      - master
    paths:
      - 'client/**'
      - '.github/workflows/frontend.yml'
  pull_request:
    branches:
      - master
    paths:
      - 'client/**'
      - '.github/workflows/frontend.yml'
  workflow_dispatch:
    inputs:
      deploy_all:
        description: 'Desplegar todos los microfrontends (ignora los cambios detectados)'
        type: boolean
        default: true

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-2

jobs:
  # Que microfrontends toco este push. mf-shared es codigo fuente que TODOS los
  # MFEs empaquetan en su bundle (design system, tipos, helpers), asi que si
  # cambia hay que reconstruirlos todos; igual con los archivos raiz del
  # monorepo (mf.config.ts, package.json, infra, este workflow).
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.plan.outputs.packages }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Filter changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            global:
              - 'client/package.json'
              - 'client/package-lock.json'
              - 'client/mf.config.ts'
              - 'client/packages/tsconfig.base.json'
              - 'client/infra/**'
              - '.github/workflows/frontend.yml'
            shared:
              - 'client/packages/mf-shared/**'
            shell:
              - 'client/packages/mf-shell/**'
            auth:
              - 'client/packages/mf-auth/**'
            campaigns:
              - 'client/packages/mf-campaigns/**'
            donations:
              - 'client/packages/mf-donations/**'
            admin:
              - 'client/packages/mf-admin/**'

      - name: Plan deploy matrix
        id: plan
        shell: bash
        run: |
          ALL='["shell","shared","auth","campaigns","donations","admin"]'

          # Un cambio en mf-shared o en la raiz del monorepo afecta a todos.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] \
            || [ "${{ steps.filter.outputs.global }}" = "true" ] \
            || [ "${{ steps.filter.outputs.shared }}" = "true" ]; then
            PACKAGES="$ALL"
          else
            PACKAGES=$(jq -cn --argjson p '[
              {"name":"shell","changed":${{ steps.filter.outputs.shell }}},
              {"name":"auth","changed":${{ steps.filter.outputs.auth }}},
              {"name":"campaigns","changed":${{ steps.filter.outputs.campaigns }}},
              {"name":"donations","changed":${{ steps.filter.outputs.donations }}},
              {"name":"admin","changed":${{ steps.filter.outputs.admin }}}
            ]' '$p | map(select(.changed)) | map(.name)')
          fi

          echo "packages=${PACKAGES}" >> "$GITHUB_OUTPUT"
          echo "A desplegar: ${PACKAGES}"

  ci:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        working-directory: ./client
        run: npm ci

      - name: Test
        working-directory: ./client
        run: npm test --if-present

      # Se construye todo el monorepo: valida que ningun MFE quede roto.
      - name: Build
        working-directory: ./client
        run: npm run build

  resolve-deploy-env:
    name: Resolve Deploy Environment
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.resolve.outputs.should_deploy }}
      target_env: ${{ steps.resolve.outputs.target_env }}
      stage: ${{ steps.resolve.outputs.stage }}
    steps:
      - name: Resolve deploy target
        id: resolve
        shell: bash
        run: |
          SHOULD_DEPLOY="false"
          TARGET_ENV=""
          STAGE=""

          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/feature/develop" ]; then
            SHOULD_DEPLOY="true"
            TARGET_ENV="qa"
            STAGE="qa"
          elif [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/master" ]; then
            SHOULD_DEPLOY="true"
            TARGET_ENV="prd"
            STAGE="prod"
          fi

          echo "should_deploy=${SHOULD_DEPLOY}" >> "$GITHUB_OUTPUT"
          echo "target_env=${TARGET_ENV}" >> "$GITHUB_OUTPUT"
          echo "stage=${STAGE}" >> "$GITHUB_OUTPUT"

  # Buckets (uno por microfrontend) + la unica distribucion CloudFront que los
  # compone. Idempotente: se ejecuta en cada deploy y no cambia nada si no hay
  # diferencias en la plantilla.
  infra:
    name: Provision infra (S3 + CloudFront)
    runs-on: ubuntu-latest
    needs: [ci, resolve-deploy-env]
    if: needs.resolve-deploy-env.outputs.should_deploy == 'true'
    environment: ${{ needs.resolve-deploy-env.outputs.target_env }}
    outputs:
      dist_id: ${{ steps.stack.outputs.dist_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (QA)
        if: needs.resolve-deploy-env.outputs.target_env == 'qa'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME_QAS }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Configure AWS credentials (PRD)
        if: needs.resolve-deploy-env.outputs.target_env == 'prd'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME_PRD }}
          aws-region: ${{ secrets.AWS_REGION }}

      # Salvaguarda: la plantilla es la unica fuente de verdad del dominio, asi
      # que un deploy con estas variables vacias DEJARIA A LA DISTRIBUCION SIN
      # alternate domain names y creayni.com dejaria de resolver (CloudFront
      # responde 403 a los Host que no conoce). Preferimos fallar aqui, antes
      # de tocar nada. Deben ser "Variables" (no "Secrets"): el workflow las lee
      # con vars.*, y un secret llegaria como cadena vacia.
      - name: Check domain vars
        shell: bash
        run: |
          if [ -z "${{ vars.CF_DOMAIN_NAMES }}" ] || [ -z "${{ vars.ACM_CERTIFICATE_ARN }}" ]; then
            echo "::error::Faltan las Variables CF_DOMAIN_NAMES y/o ACM_CERTIFICATE_ARN."
            echo "Settings > Secrets and variables > Actions > pestana 'Variables'."
            echo "Sin ellas el deploy borraria el dominio de la distribucion. Abortado."
            exit 1
          fi
          echo "Dominios: ${{ vars.CF_DOMAIN_NAMES }}"

      # Para servir el dominio propio, define en GitHub las variables:
      #   CF_DOMAIN_NAMES      -> "creayni.com,www.creayni.com"
      #   ACM_CERTIFICATE_ARN  -> certificado ACM emitido en us-east-1
      - name: Deploy CloudFormation stack
        shell: bash
        run: |
          aws cloudformation deploy \
            --template-file client/infra/cloudfront-s3.yml \
            --stack-name "sembramos-client-${{ needs.resolve-deploy-env.outputs.stage }}" \
            --parameter-overrides \
              Stage=${{ needs.resolve-deploy-env.outputs.stage }} \
              DomainNames="${{ vars.CF_DOMAIN_NAMES }}" \
              CertificateArn="${{ vars.ACM_CERTIFICATE_ARN }}" \
              PriceClass="${{ vars.CF_PRICE_CLASS || 'PriceClass_All' }}" \
            --capabilities CAPABILITY_IAM \
            --region "$AWS_REGION"

      - name: Read stack outputs
        id: stack
        shell: bash
        run: |
          STACK="sembramos-client-${{ needs.resolve-deploy-env.outputs.stage }}"
          DIST_ID=$(aws cloudformation describe-stacks --stack-name "$STACK" --region "$AWS_REGION" \
            --query "Stacks[0].Outputs[?OutputKey=='DistributionId'].OutputValue" --output text)
          URL=$(aws cloudformation describe-stacks --stack-name "$STACK" --region "$AWS_REGION" \
            --query "Stacks[0].Outputs[?OutputKey=='SiteUrl'].OutputValue" --output text)
          CF_DOMAIN=$(aws cloudformation describe-stacks --stack-name "$STACK" --region "$AWS_REGION" \
            --query "Stacks[0].Outputs[?OutputKey=='DistributionDomainName'].OutputValue" --output text)
          echo "dist_id=${DIST_ID}" >> "$GITHUB_OUTPUT"
          echo "Frontend URL: ${URL}"
          echo "Apunta tu DNS (CNAME/ALIAS) a: ${CF_DOMAIN}"

  # Un job por microfrontend: construye y sube SOLO ese paquete a SU bucket.
  deploy:
    name: Deploy mf-${{ matrix.package }}
    runs-on: ubuntu-latest
    needs: [changes, resolve-deploy-env, infra]
    if: >-
      needs.resolve-deploy-env.outputs.should_deploy == 'true' &&
      needs.changes.outputs.packages != '[]'
    environment: ${{ needs.resolve-deploy-env.outputs.target_env }}
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJson(needs.changes.outputs.packages) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Configure AWS credentials (QA)
        if: needs.resolve-deploy-env.outputs.target_env == 'qa'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME_QAS }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Configure AWS credentials (PRD)
        if: needs.resolve-deploy-env.outputs.target_env == 'prd'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME_PRD }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Install dependencies
        working-directory: ./client
        run: npm ci

      # Las VITE_* de los microservicios se incrustan en build-time. Las
      # VITE_MF_*_URL le dicen al shell donde pedir cada remoteEntry.js: rutas
      # del propio dominio, por eso no hay CORS entre microfrontends.
      - name: Build mf-${{ matrix.package }}
        working-directory: ./client
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_CAMPAIGN_API_URL: ${{ vars.VITE_CAMPAIGN_API_URL }}
          VITE_FUNDING_API_URL: ${{ vars.VITE_FUNDING_API_URL }}
          VITE_MF_SHARED_URL: /mf/shared/assets/remoteEntry.js
          VITE_MF_AUTH_URL: /mf/auth/assets/remoteEntry.js
          VITE_MF_CAMPAIGNS_URL: /mf/campaigns/assets/remoteEntry.js
          VITE_MF_DONATIONS_URL: /mf/donations/assets/remoteEntry.js
          VITE_MF_ADMIN_URL: /mf/admin/assets/remoteEntry.js
        run: npm -w mf-${{ matrix.package }} run build

      # El shell vive en la raiz del sitio; cada MFE, bajo mf/<nombre>/ dentro
      # de SU bucket (CloudFront reenvia la URI completa al origen, asi que la
      # clave en S3 debe coincidir con la ruta publica).
      #
      # Cache: los assets llevan hash en el nombre => immutable. index.html y
      # los remoteEntry.js NO llevan hash (son el manifiesto de cada MFE) =>
      # no-cache, para que un deploy se vea de inmediato.
      - name: Sync mf-${{ matrix.package }} to S3
        shell: bash
        run: |
          MF="${{ matrix.package }}"
          STAGE="${{ needs.resolve-deploy-env.outputs.stage }}"
          DIST="client/packages/mf-${MF}/dist"
          IMMUTABLE="public,max-age=31536000,immutable"
          NO_CACHE="no-cache,no-store,must-revalidate"

          if [ "$MF" = "shell" ]; then
            BUCKET="sembramos-client-${STAGE}"
            aws s3 sync "$DIST" "s3://${BUCKET}" --delete \
              --exclude index.html \
              --cache-control "$IMMUTABLE"
            aws s3 cp "$DIST/index.html" "s3://${BUCKET}/index.html" \
              --cache-control "$NO_CACHE"
            echo "paths=/*" >> "$GITHUB_ENV"
          else
            BUCKET="sembramos-mf-${MF}-${STAGE}"
            aws s3 sync "$DIST" "s3://${BUCKET}/mf/${MF}" --delete \
              --exclude "assets/remoteEntry.js" \
              --cache-control "$IMMUTABLE"
            aws s3 cp "$DIST/assets/remoteEntry.js" "s3://${BUCKET}/mf/${MF}/assets/remoteEntry.js" \
              --cache-control "$NO_CACHE"
            echo "paths=/mf/${MF}/*" >> "$GITHUB_ENV"
          fi

      - name: Invalidate CloudFront cache
        shell: bash
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ needs.infra.outputs.dist_id }}" \
            --paths "${{ env.paths }}"
