name: AI Analytics Service CI/CD

on:
  push:
    branches:
      - feature/develop
      - master
    paths:
      - 'ai-analytics-service/**'
      - '.github/workflows/ai-analytics-service.yml'
  pull_request:
    branches:
      - master
    paths:
      - 'ai-analytics-service/**'
      - '.github/workflows/ai-analytics-service.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-2

jobs:
  ci:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        working-directory: ./ai-analytics-service
        run: pip install -r requirements.txt

  resolve-deploy-env:
    name: Resolve Deploy Environment
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.resolve.outputs.should_deploy }}
      target_env: ${{ steps.resolve.outputs.target_env }}
      stage: ${{ steps.resolve.outputs.stage }}
    steps:
      - name: Resolve deploy target
        id: resolve
        shell: bash
        run: |
          SHOULD_DEPLOY="false"
          TARGET_ENV=""
          STAGE=""

          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/feature/develop" ]; then
            SHOULD_DEPLOY="true"
            TARGET_ENV="qa"
            STAGE="qa"
          elif [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/master" ]; then
            SHOULD_DEPLOY="true"
            TARGET_ENV="prd"
            STAGE="prod"
          fi

          echo "should_deploy=${SHOULD_DEPLOY}" >> "$GITHUB_OUTPUT"
          echo "target_env=${TARGET_ENV}" >> "$GITHUB_OUTPUT"
          echo "stage=${STAGE}" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy Lambda
    runs-on: ubuntu-latest
    needs: [ci, resolve-deploy-env]
    if: needs.resolve-deploy-env.outputs.should_deploy == 'true'
    environment: ${{ needs.resolve-deploy-env.outputs.target_env }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configure AWS credentials (QA)
        if: needs.resolve-deploy-env.outputs.target_env == 'qa'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME_QAS }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Configure AWS credentials (PRD)
        if: needs.resolve-deploy-env.outputs.target_env == 'prd'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME_PRD }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Install Serverless Framework
        run: |
          npm install -g serverless
          serverless plugin install -n serverless-python-requirements
        working-directory: ./ai-analytics-service

      - name: Deploy with Serverless (QA)
        if: needs.resolve-deploy-env.outputs.target_env == 'qa'
        working-directory: ./ai-analytics-service
        env:
          SERVERLESS_ACCESS_KEY: ${{ secrets.SERVERLESS_ACCESS_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL_QAS }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY_QAS }}
        run: serverless deploy --config serverless.deploy.yml --stage ${{ secrets.STAGE_QAS }}

      - name: Deploy with Serverless (PRD)
        if: needs.resolve-deploy-env.outputs.target_env == 'prd'
        working-directory: ./ai-analytics-service
        env:
          SERVERLESS_ACCESS_KEY: ${{ secrets.SERVERLESS_ACCESS_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL_PRD }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY_PRD }}
        run: serverless deploy --config serverless.deploy.yml --stage ${{ secrets.STAGE_PRD }}
