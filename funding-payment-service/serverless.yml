service: sembramos-funding-payment-service
frameworkVersion: ~4.34.0

package:
  individually: true
  patterns:
    - dist/**
    - node_modules/**
    - package.json
    - package-lock.json
    - prisma/**
    - '!src/**'
    - '!node_modules/**/test/**'
    - '!node_modules/**/*.md'
    - '!node_modules/typescript/**'
    - '!node_modules/ts-node-dev/**'
    - '!node_modules/jest/**'
    - '!node_modules/ts-jest/**'
    - '!node_modules/@types/**'
    - '!node_modules/prisma/**'

provider:
  name: aws
  runtime: nodejs20.x
  region: us-east-2
  environment:
    DATABASE_URL: ${env:DATABASE_URL}
    JWT_ACCESS_SECRET: ${env:JWT_ACCESS_SECRET, 'local-access-secret'}
    PAYMENT_WEBHOOK_SECRET: ${env:PAYMENT_WEBHOOK_SECRET, 'local-webhook-secret'}

functions:
  api:
    handler: dist/lambda.handler
    events:
      - httpApi: '*'

plugins:
  - serverless-offline
