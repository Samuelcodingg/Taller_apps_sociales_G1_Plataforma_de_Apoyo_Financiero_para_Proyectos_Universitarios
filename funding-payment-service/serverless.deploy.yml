service: sembramos-funding-payment-service
frameworkVersion: ~4.34.0

package:
  individually: true
  patterns:
    # --- Inclusiones explicitas (lo unico que necesita la Lambda en runtime) ---
    - dist/**
    - node_modules/**
    - package.json
    - package-lock.json
    - prisma/**

    # --- Codigo fuente y artefactos de compilacion innecesarios ---
    - '!src/**'
    - '!**/*.ts'
    - '!**/*.map'
    - '!**/tsconfig*.json'

    # --- Archivos ocultos, cachés y basura del entorno ---
    - '!.git/**'
    - '!.github/**'
    - '!.vscode/**'
    - '!.env'
    - '!.env.*'
    - '!**/.gitignore'
    - '!node_modules/.cache/**'
    - '!node_modules/.bin/**'

    # --- Documentacion y tests dentro de dependencias ---
    - '!node_modules/**/*.md'
    - '!node_modules/**/test/**'
    - '!node_modules/**/tests/**'
    - '!node_modules/**/*.test.js'

    # --- Dependencias de desarrollo (no deben viajar a Lambda) ---
    - '!node_modules/typescript/**'
    - '!node_modules/ts-node-dev/**'
    - '!node_modules/ts-jest/**'
    - '!node_modules/jest/**'
    - '!node_modules/jest-*/**'
    - '!node_modules/@jest/**'
    - '!node_modules/@types/**'
    - '!node_modules/supertest/**'
    - '!node_modules/serverless/**'
    - '!node_modules/serverless-offline/**'
    - '!node_modules/prisma/**'

    # NOTA: @aws-sdk/@smithy SI se empaquetan (el runtime no los provee de forma
    # fiable). Hay margen de tamano de sobra tras adelgazar Prisma.

    # --- Prisma 7: adelgazamiento del runtime ---
    # El runtime de @prisma/client embebe compiladores WASM para TODAS las BD
    # en variantes fast/small y js/mjs (~70 MB). Solo usamos MySQL/MariaDB.
    - '!node_modules/@prisma/client/runtime/query_compiler_*_bg.postgresql.*'
    - '!node_modules/@prisma/client/runtime/query_compiler_*_bg.sqlserver.*'
    - '!node_modules/@prisma/client/runtime/query_compiler_*_bg.cockroachdb.*'
    - '!node_modules/@prisma/client/runtime/query_compiler_*_bg.sqlite.*'
    # Paquetes que arrastra el CLI 'prisma' (Prisma Studio con React, dev tools,
    # effect/electric-sql) y que NO se usan en runtime.
    - '!node_modules/@prisma/studio-core/**'
    - '!node_modules/@prisma/dev/**'
    - '!node_modules/effect/**'
    - '!node_modules/@electric-sql/**'
    - '!node_modules/react/**'
    - '!node_modules/react-dom/**'
    - '!node_modules/chart.js/**'
    - '!node_modules/@radix-ui/**'

    # --- Purga critica de Prisma: fuera TODOS los engines binarios ---
    - '!node_modules/@prisma/engines/**'
    - '!node_modules/.prisma/client/libquery_engine-*'
    # Reincluir UNICAMENTE el query engine de AWS Lambda (debe ir al final
    # para que prevalezca sobre la exclusion anterior).
    - node_modules/.prisma/client/libquery_engine-rhel-openssl-3.0.x.so.node

provider:
  name: aws
  runtime: nodejs20.x
  region: us-east-2
  timeout: 30
  # Sin VPC: la Lambda corre fuera de la VPC y se conecta a RDS por su endpoint
  # publico. Salida a internet gestionada por AWS sin coste; se evita el NAT
  # Gateway. Requisito: el SG de RDS debe permitir 3306 entrante.
  environment:
    DATABASE_URL: ${env:DATABASE_URL}
    # Secreto JWT compartido entre microservicios para validar los access tokens
    # emitidos por identity-profile-service. Default igual al de los demas.
    JWT_ACCESS_SECRET: ${env:JWT_ACCESS_SECRET, 'local-access-secret'}
    # Secreto que valida la firma de los webhooks de la pasarela de pago.
    PAYMENT_WEBHOOK_SECRET: ${env:PAYMENT_WEBHOOK_SECRET, 'local-webhook-secret'}

functions:
  api:
    handler: dist/lambda.handler
    events:
      - httpApi: '*'
